<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Alquiler ESP 2025</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--g:#1D9E75;--gl:#E1F5EE;--gd:#085041;--r:#E24B4A;--rl:#FCEBEB;--rd:#791F1F;--a:#BA7517;--al:#FAEEDA;--ad:#633806;--bg:#F7F6F2;--sf:#fff;--br:#E5E3DC;--tx:#1A1A18;--mu:#7A7870}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.top{background:var(--sf);border-bottom:1px solid var(--br);padding:0 2rem;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.top-ttl{font-family:'DM Serif Display',serif;font-size:18px;flex:1}
.bdg{font-size:11px;background:var(--gl);color:var(--gd);border-radius:20px;padding:3px 12px;font-weight:500}
.btn{display:none;align-items:center;gap:8px;padding:7px 14px;border-radius:8px;border:1px solid var(--br);background:var(--sf);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;color:var(--tx)}
.btn:hover{background:var(--bg)}
.btn.show{display:flex}
.main{max-width:1280px;margin:0 auto;padding:2.5rem 2rem}
.ucard{background:var(--sf);border:1px solid var(--br);border-radius:16px;padding:3rem 2rem;text-align:center;margin-bottom:1.5rem}
.ucard h1{font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:8px}
.ucard p{color:var(--mu);font-size:14px;margin-bottom:1.5rem}
.drop{border:1.5px dashed var(--br);border-radius:12px;padding:2rem;cursor:pointer;transition:all .15s;max-width:500px;margin:0 auto}
.drop:hover,.drop.over{border-color:var(--g);background:var(--gl)}
.drop p{font-size:14px;color:var(--mu)}
.drop strong{color:var(--g)}
#fi{display:none}
.err{display:none;background:var(--rl);color:var(--rd);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:1rem}
.prev-card{background:var(--sf);border:1px solid var(--br);border-radius:12px;padding:14px 20px;margin-bottom:1.5rem;font-size:13px;display:none}
.prev-card strong{color:var(--tx)}
.sum{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:1.5rem}
.met{background:var(--sf);border:1px solid var(--br);border-radius:12px;padding:16px 18px}
.met-l{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.met-v{font-family:'DM Serif Display',serif;font-size:22px}
.met-v.pos{color:var(--g)}.met-v.neg{color:var(--r)}.met-v.warn{color:var(--a)}
.met-sub{font-size:11px;color:var(--mu);margin-top:4px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:1.5rem}
.mo-sel{font-family:'DM Sans',sans-serif;font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--br);background:var(--sf);color:var(--tx);cursor:pointer;outline:none}
.mo-sel:focus{border-color:var(--g)}
.tbl-wrap{background:var(--sf);border:1px solid var(--br);border-radius:14px;overflow:hidden;margin-bottom:1.5rem}
.tbl-head{padding:14px 20px;border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between}
.tbl-head h2{font-family:'DM Serif Display',serif;font-size:17px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);padding:10px 14px;text-align:right;font-weight:500;border-bottom:1px solid var(--br);background:var(--bg);white-space:nowrap}
th:first-child{text-align:left}
td{padding:10px 14px;text-align:right;border-bottom:1px solid #f0ede6}
td:first-child{text-align:left;font-weight:500}
tr:last-child td{border-bottom:none}
tr:hover td{background:#faf9f6}
.rag{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;flex-shrink:0}
.rag.g{background:var(--g)}.rag.a{background:var(--a)}.rag.r{background:var(--r)}.rag.n{background:var(--br)}
.pos-val{color:var(--gd)}.neg-val{color:var(--rd)}.warn-val{color:var(--ad)}
.no-bgt{color:var(--mu);font-style:italic;font-size:12px}
.expand-btn{background:none;border:none;cursor:pointer;color:var(--mu);font-size:12px;padding:2px 6px;border-radius:4px}
.expand-btn:hover{background:var(--bg);color:var(--g)}
.mo-detail{display:none;background:#faf9f6}
.mo-detail.open{display:table-row-group}
.mo-detail td{font-size:12px;color:var(--mu);padding:6px 14px 6px 32px;border-bottom:1px solid #f5f2ec}
.mo-detail td:first-child{text-align:left}
.ptbl th:nth-child(n+2){min-width:90px}
#res{display:none}
</style>
</head>
<body>
<div class="top">
  <span class="top-ttl">Performance · Alquiler ESP 2025</span>

    </div>

  <div id="res">
    <div class="sum" id="sum"></div>

    <div id="content"></div>

</div>

<script>
const BUDGET = [{"name":"Castellon 3","months":{"1":2120.0,"2":2120.0,"3":2120.0,"4":2120.31,"5":2120.0,"6":2120.0,"7":2120.0,"8":2120.1,"9":2120.0,"10":2120.0,"11":2120.0,"12":1802.72}},{"name":"Coliving Malaga 1","months":{"1":2529.13,"2":2529.13,"3":2529.13,"4":2529.5,"5":2529.13,"6":2529.13,"7":2529.13,"8":2529.25,"9":2529.13,"10":2529.13,"11":2529.13,"12":2150.62}},{"name":"Coliving Malaga 2","months":{"1":3445.19,"2":3445.19,"3":3445.19,"4":3445.69,"5":3445.19,"6":3445.19,"7":3445.19,"8":3445.36,"9":3445.19,"10":3445.19,"11":3445.19,"12":2929.58}},{"name":"Libeen","months":{"1":1778.33,"2":1778.33,"3":1778.33,"4":1778.59,"5":1778.33,"6":1778.33,"7":1778.33,"8":1778.42,"9":1778.33,"10":1778.33,"11":1778.33,"12":1512.19}},{"name":"Malaga 2","months":{"1":2077.82,"2":2077.82,"3":2077.82,"4":2078.12,"5":2077.82,"6":2077.82,"7":2077.82,"8":2077.92,"9":2077.82,"10":2077.82,"11":2077.82,"12":1766.85}},{"name":"Malaga 3","months":{"1":1991.68,"2":1991.68,"3":1991.68,"4":1991.97,"5":1991.68,"6":1991.68,"7":1991.68,"8":1991.78,"9":1991.68,"10":1991.68,"11":1991.68,"12":1693.61}},{"name":"Malaga 4","months":{"1":836.17,"2":836.17,"3":836.17,"4":836.29,"5":836.17,"6":836.17,"7":836.17,"8":836.21,"9":836.17,"10":836.17,"11":836.17,"12":711.03}},{"name":"Malaga 5","months":{"1":2015.21,"2":2015.21,"3":2015.21,"4":2015.5,"5":2015.21,"6":2015.21,"7":2015.21,"8":2015.31,"9":2015.21,"10":2015.21,"11":1007.61,"12":856.81}},{"name":"Malaga 6","months":{"1":2011.35,"2":2011.35,"3":2011.35,"4":2011.64,"5":2011.35,"6":2011.35,"7":2011.35,"8":2011.45,"9":2011.35,"10":2011.35,"11":2011.35,"12":1710.33}},{"name":"Malaga 7","months":{"1":1956.92,"2":1956.92,"3":1956.92,"4":1957.2,"5":1956.92,"6":1956.92,"7":1956.92,"8":1957.02,"9":1956.92,"10":1956.92,"11":1956.92,"12":1664.05}},{"name":"Malaga 8","months":{"1":1956.92,"2":1956.92,"3":1956.92,"4":1957.2,"5":1956.92,"6":1956.92,"7":1956.92,"8":1957.02,"9":1956.92,"10":1956.92,"11":1956.92,"12":1664.05}},{"name":"Oviedo 1","months":{"1":1 const BUDGET_MAP = {};
BUDGET.forEach(b => { BUDGET_MAP[b.name.toLowerCase()] = b; });

const MONTHS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const fmt = n => new Intl.NumberFormat('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' €';
const fmtS = n => (n>=0?'+':'')+fmt(n);
const fmtPct = n => (n>=0?'+':'')+n.toFixed(1)+'%';

let pyg = {}, curMo = 'all';

function showErr(msg){const e=document.getElementById('err');e.style.display='block';e.textContent=msg;}

function parseNum(s){
  if(!s) return 0;
  let c=String(s).replace(/[\u00a0\u202f\s]/g,'').replace(/[€$]/g,'');
  if(!c||c==='-') return 0;
  // detect decimal separator: if last separator is comma → Spanish
  const lastComma=c.lastIndexOf(',');
  const lastDot=c.lastIndexOf('.');
  if(lastComma>lastDot) c=c.replace(/\./g,'').replace(',','.');
  else c=c.replace(/,/g,'');
  const n=parseFloat(c); return isNaN(n)?0:n;
}

function parseDate(s){
  if(!s) return null;
  const p=s.trim();
  let m=p.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return{y:+m[3],mo:+m[2]-1};
  m=p.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return{y:+m[1],mo:+m[2]-1};
  m=p.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
  if(m) return{y:+m[3],mo:+m[2]-1};
  return null;
}

function splitCSV(line){
  const res=[]; let cur='', inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if((ch===','||ch==='\t')&&!inQ){res.push(cur);cur='';}
    else cur+=ch;
  }
  res.push(cur);
  return res.map(s=>s.trim().replace(/^"|"$/g,''));
}

function parseFile(txt){
  const lines=txt.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  const merged=[]; let buf='';
  for(const line of lines){
    buf=buf?buf+'\n'+line:line;
    if((buf.match(/"/g)||[]).length%2===0){merged.push(buf);buf='';}
  }
  if(buf) merged.push(buf);
  // find header row
  let hdrIdx=-1;
  for(let i=0;i<Math.min(merged.length,20);i++){
    const row=splitCSV(merged[i]);
    if(row.length>=3&&row.some(c=>c.length>0)){hdrIdx=i;break;}
  }
  if(hdrIdx<0) return null;
  const hdr=splitCSV(merged[hdrIdx]).map(h=>h.trim());
  const data=[];
  for(let i=hdrIdx+1;i<merged.length;i++){
    const row=splitCSV(merged[i]);
    if(row.every(c=>!c.trim())) continue;
    data.push(row);
  }
  return{hdr,data};
}

function findCol(hdr,...names){
  for(const name of names){
    let i=hdr.findIndex(h=>h.toLowerCase()===name.toLowerCase());
    if(i>=0) return i;
    i=hdr.findIndex(h=>h.toLowerCase().includes(name.toLowerCase()));
    if(i>=0) return i;
  }
  return -1;
}

// Drop / file input
const dz=document.getElementById('dz');
dz.onclick=()=>document.getElementById('fi').click();
dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};
dz.ondragleave=()=>dz.classList.remove('over');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');handleFiles(e.dataTransfer.files)};
document.getElementById('fi').onchange=e=>handleFiles(e.target.files);

function handleFiles(files){
  if(!files.length) return;
  const results=[]; let done=0;
  Array.from(files).forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{results.push({name:f.name,text:e.target.result});if(++done===files.length)processFiles(results);};
    r.readAsText(f,'UTF-8');
  });
}

function processFiles(results){
  pyg={};
  const labels=[];
  let colsInfo=null;

  results.forEach(({name,text})=>{
    const parsed=parseFile(text);
    if(!parsed){showErr(`No se encontró cabecera en: ${name}`);return;}
    const {hdr,data}=parsed;

    // Hardcoded column detection — no user input needed
    const cN=findCol(hdr,'Nombre de la cuenta','nombre cuenta','nombre');
    const cD=findCol(hdr,'Debe','debit');
    const cH=findCol(hdr,'Haber','credit');
    const cF=findCol(hdr,'Fecha','date');

    if(cN<0||cD<0||cH<0){
      showErr(`No se encontraron las columnas Nombre, Debe o Haber en: ${name}. Columnas detectadas: ${hdr.join(', ')}`);
      return;
    }

    if(!colsInfo) colsInfo={cN,cD,cH,cF,hdrs:hdr};
    labels.push(name);

    data.forEach(row=>{
      const nombre=(row[cN]||'').trim();
      if(!nombre) return;
      const debe=parseNum(row[cD]);
      const haber=parseNum(row[cH]);
      if(debe===0&&haber===0) return;
      const dt=cF>=0?parseDate(row[cF]):null;
      if(!dt) return;
      const moKey=`${dt.y}-${String(dt.mo+1).padStart(2,'0')}`;
      if(!pyg[nombre]) pyg[nombre]={monthly:{}};
      if(!pyg[nombre].monthly[moKey]) pyg[nombre].monthly[moKey]={ing:0,gas:0};
      if(haber>0) pyg[nombre].monthly[moKey].ing+=haber;
      if(debe>0) pyg[nombre].monthly[moKey].gas+=debe;
    });
  });

  if(!Object.keys(pyg).length) return;

  // Show preview
  const prev=document.getElementById('prev');
  prev.style.display='block';
  prev.innerHTML=labels.map(f=>`<span style="display:inline-block;background:var(--gl);color:var(--gd);border-radius:4px;padding:2px 8px;font-size:11px;margin-right:6px">✓ ${f}</span>`).join('')+
    (colsInfo?`<span style="color:var(--mu);margin-left:8px;font-size:12px">Columnas: Nombre col.${colsInfo.cN+1} · Debe col.${colsInfo.cD+1} · Haber col.${colsInfo.cH+1}${colsInfo.cF>=0?' · Fecha col.'+(colsInfo.cF+1):''}</span>`:'');

  document.getElementById('up').style.display='none';
  document.getElementById('res').style.display='block';
  document.getElementById('bShare').classList.add('show');
  document.getElementById('bRst').classList.add('show');
  render();
}

// Budget helpers
function findBudget(pisoName){
  const key=pisoName.toLowerCase().trim();
  if(BUDGET_MAP[key]) return BUDGET_MAP[key];
  for(const [k,v] of Object.entries(BUDGET_MAP)){
    if(key.includes(k)||k.includes(key)) return v;
    const parts=key.split(/\s+/);
    if(parts.length>=2&&k===parts.slice(-2).join(' ')) return v;
    if(k===parts[parts.length-1]) return v;
  }
  return null;
}

function getBudget(pisoName, mo){
  const b=findBudget(pisoName);
  if(!b) return null;
  if(mo==='all') return Object.values(b.months).reduce((a,v)=>a+v,0)||null;
  const mNum=parseInt(mo.split('-')[1]);
  return b.months[String(mNum)]||null;
}

function getReal(pisoName, mo){
  const p=pyg[pisoName];
  if(!p) return{ing:0,gas:0};
  if(mo==='all'){
    let ing=0,gas=0;
    Object.values(p.monthly).forEach(m=>{ing+=m.ing;gas+=m.gas;});
    return{ing,gas};
  }
  return p.monthly[mo]||{ing:0,gas:0};
}

function ragClass(pct){
  if(pct===null) return 'n';
  if(pct>=-5) return 'g';
  if(pct>=-15) return 'a';
  return 'r';
}

function getAllMonths(){
  const mo=new Set();
  Object.values(pyg).forEach(p=>Object.keys(p.monthly).forEach(k=>mo.add(k)));
  return [...mo].sort();
}

function render(){renderSummary();renderFilters();renderTable();}

function renderSummary(){
  const pisos=Object.keys(pyg);
  let tIng=0,tBgt=0,tGas=0,nBgt=0,nOk=0;
  pisos.forEach(p=>{
    const r=getReal(p,curMo); tIng+=r.ing; tGas+=r.gas;
    const b=getBudget(p,curMo);
    if(b){tBgt+=b;nBgt++;const dev=(r.ing-b)/b*100;if(dev>=-5)nOk++;}
  });
  const devP=tBgt>0?(tIng-tBgt)/tBgt*100:null;
  const neto=tIng-tGas;
  document.getElementById('sum').innerHTML=`
    <div class="met"><div class="met-l">Ingresos reales</div><div class="met-v pos">${fmt(tIng)}</div><div class="met-sub">${curMo==='all'?'Acumulado':'Mes seleccionado'}</div></div>
    <div class="met"><div class="met-l">Presupuesto</div><div class="met-v">${tBgt>0?fmt(tBgt):'—'}</div><div class="met-sub">${nBgt} pisos con presupuesto</div></div>
    <div class="met"><div class="met-l">Desviación ingresos</div><div class="met-v ${devP===null?'':devP>=-5?'pos':devP>=-15?'warn':'neg'}">${devP===null?'—':fmtPct(devP)}</div><div class="met-sub">vs presupuesto</div></div>
    <div class="met"><div class="met-l">Resultado neto</div><div class="met-v ${neto>=0?'pos':'neg'}">${fmt(neto)}</div><div class="met-sub">Ingresos − gastos</div></div>
    <div class="met"><div class="met-l">Pisos en verde</div><div class="met-v pos">${nOk} / ${nBgt}</div><div class="met-sub">Desviación ≥ −5%</div></div>`;
}

function renderFilters(){
  const months=getAllMonths();
  let opts=`<option value="all">Todos los meses</option>`;
  months.forEach(m=>{
    const [y,mo]=m.split('-');
    opts+=`<option value="${m}"${m===curMo?' selected':''}>${MONTHS[parseInt(mo)-1]} ${y}</option>`;
  });
  document.getElementById('filters').innerHTML=`
    <select class="mo-sel" onchange="curMo=this.value;render()">${opts}</select>
    <span style="font-size:12px;color:var(--mu)">Semáforo: <span style="color:var(--g)">● ≥−5%</span> <span style="color:var(--a)">● entre −5% y −15%</span> <span style="color:var(--r)">● &lt;−15%</span></span>`;
}

function renderTable(){
  const pisos=Object.keys(pyg).sort();
  const allMo=getAllMonths();
  let tbody='';

  pisos.forEach((p,idx)=>{
    const r=getReal(p,curMo);
    const b=getBudget(p,curMo);
    const devE=b!==null?r.ing-b:null;
    const devP=b!==null&&b>0?(r.ing-b)/b*100:null;
    const rag=ragClass(devP);
    const neto=r.ing-r.gas;

    // Monthly sub-rows
    let moRows='';
    allMo.forEach(mo=>{
      const mr=pyg[p]?.monthly[mo];
      if(!mr||(!mr.ing&&!mr.gas)) return;
      const [,m]=mo.split('-');
      const mb=getBudget(p,mo);
      const mdP=mb&&mb>0?(mr.ing-mb)/mb*100:null;
      const mr2=ragClass(mdP);
      moRows+=`<tr>
        <td style="padding-left:32px;font-size:11px;font-weight:400">${MONTHS[parseInt(m)-1]}</td>
        <td class="pos-val">${fmt(mr.ing)}</td>
        <td>${mb?fmt(mb):'<span class="no-bgt">—</span>'}</td>
        <td>${mb?`<span class="${mr.ing-mb>=0?'pos-val':mr.ing-mb>=-0.15*mb?'warn-val':'neg-val'}">${fmtS(mr.ing-mb)}</span>`:'—'}</td>
        <td>${mdP!==null?`<span class="rag ${mr2}"></span><span class="${mdP>=-5?'pos-val':mdP>=-15?'warn-val':'neg-val'}">${fmtPct(mdP)}</span>`:'—'}</td>
        <td>${fmt(mr.gas)}</td>
        <td class="${(mr.ing-mr.gas)>=0?'pos-val':'neg-val'}">${fmt(mr.ing-mr.gas)}</td>
      </tr>`;
    });

    tbody+=`<tr>
      <td><span class="rag ${rag}"></span><strong style="cursor:pointer" onclick="toggleDetail(${idx})">${p}</strong>
        <button class="expand-btn" id="exp${idx}" onclick="toggleDetail(${idx})">▸ meses</button></td>
      <td class="pos-val">${fmt(r.ing)}</td>
      <td>${b!==null?fmt(b):'<span class="no-bgt">Sin presupuesto</span>'}</td>
      <td>${devE!==null?`<span class="${devE>=0?'pos-val':devE>=-0.15*(b||1)?'warn-val':'neg-val'}">${fmtS(devE)}</span>`:'—'}</td>
      <td>${devP!==null?`<span class="rag ${rag}"></span><span class="${devP>=-5?'pos-val':devP>=-15?'warn-val':'neg-val'}">${fmtPct(devP)}</span>`:'—'}</td>
      <td>${fmt(r.gas)}</td>
      <td class="${neto>=0?'pos-val':'neg-val'}">${fmt(neto)}</td>
    </tr>
    <tbody class="mo-detail" id="det${idx}">${moRows}</tbody>`;
  });

  // Totals row
  let tI=0,tB=0,tG=0,hB=false;
  pisos.forEach(p=>{const r=getReal(p,curMo);tI+=r.ing;tG+=r.gas;const b=getBudget(p,curMo);if(b){tB+=b;hB=true;}});
  const tDP=hB&&tB>0?(tI-tB)/tB*100:null;

  document.getElementById('content').innerHTML=`
    <div class="tbl-wrap">
      <div class="tbl-head"><h2>Performance por piso · ${curMo==='all'?'Acumulado':MONTHS[parseInt(curMo.split('-')[1])-1]+' '+curMo.split('-')[0]}</h2></div>
      <table class="ptbl">
        <thead><tr>
          <th style="text-align:left">Piso</th>
          <th>Ing. real</th><th>Presupuesto</th><th>Desv. €</th><th>Desv. %</th><th>Gastos</th><th>Neto</th>
        </tr></thead>
        <tbody>${tbody}</tbody>
        <tfoot><tr style="background:var(--bg);font-weight:600;border-top:2px solid var(--br)">
          <td>TOTAL</td>
          <td style="text-align:right" class="pos-val">${fmt(tI)}</td>
          <td style="text-align:right">${hB?fmt(tB):'—'}</td>
          <td style="text-align:right">${hB?`<span class="${tI-tB>=0?'pos-val':'neg-val'}">${fmtS(tI-tB)}</span>`:'—'}</td>
          <td style="text-align:right">${tDP!==null?`<span class="${tDP>=-5?'pos-val':tDP>=-15?'warn-val':'neg-val'}">${fmtPct(tDP)}</span>`:'—'}</td>
          <td style="text-align:right">${fmt(tG)}</td>
          <td style="text-align:right" class="${(tI-tG)>=0?'pos-val':'neg-val'}">${fmt(tI-tG)}</td>
        </tr></tfoot>
      </table>
    </div>`;
}

function toggleDetail(idx){
  const det=document.getElementById(`det${idx}`);
  const btn=document.getElementById(`exp${idx}`);
  btn.textContent=det.classList.toggle('open')?'▾ meses':'▸ meses';
}

document.getElementById('bRst').onclick=()=>{
  pyg={};curMo='all';
  document.getElementById('up').style.display='block';
  document.getElementById('res').style.display='none';
  document.getElementById('bShare').classList.remove('show');
  document.getElementById('bRst').classList.remove('show');
  document.getElementById('err').style.display='none';
  document.getElementById('prev').style.display='none';
  document.getElementById('fi').value='';
};

async function compress(str){
  const s=new CompressionStream('gzip'),w=s.writable.getWriter();
  w.write(new TextEncoder().encode(str));w.close();
  return btoa(String.fromCharCode(...new Uint8Array(await new Response(s.readable).arrayBuffer())));
}
async function decompress(b64){
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const s=new DecompressionStream('gzip'),w=s.writable.getWriter();
  w.write(bytes);w.close();
  return new TextDecoder().decode(await new Response(s.readable).arrayBuffer());
}

async function shareApp(){
  const btn=document.getElementById('bShare');
  btn.textContent='Generando…';btn.disabled=true;
  try{
    const url=location.origin+location.pathname+'#d='+await compress(JSON.stringify({pyg,v:1}));
    await navigator.clipboard.writeText(url);
    btn.textContent='✓ Link copiado';
    setTimeout(()=>{btn.textContent='⬆ Compartir';btn.disabled=false;},3000);
  }catch(e){btn.textContent='⬆ Compartir';btn.disabled=false;alert('Error: '+e.message);}
}

async function restoreFromHash(){
  if(!location.hash.startsWith('#d=')) return;
  try{
    document.getElementById('up').innerHTML='<div style="padding:3rem;text-align:center;color:var(--mu);font-size:14px">Cargando datos…</div>';
    const data=JSON.parse(await decompress(location.hash.slice(3)));
    pyg=data.pyg;
    document.getElementById('up').style.display='none';
    document.getElementById('res').style.display='block';
    document.getElementById('bShare').classList.add('show');
    document.getElementById('bRst').classList.add('show');
    render();
  }catch(e){
    document.getElementById('up').innerHTML='<div style="padding:3rem;text-align:center;color:var(--rd);font-size:14px">Error cargando el link. Sube el archivo manualmente.</div>';
  }
}
restoreFromHash();
</script>
